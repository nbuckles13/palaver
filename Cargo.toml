[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
publish = false
license = "MIT OR Apache-2.0"
repository = "https://github.com/nbuckles13/palaver"

[workspace.dependencies]
palaver-moq-wire = { path = "crates/moq-wire" }
palaver-proto = { path = "crates/proto" }
palaver-khef-core = { path = "crates/khef-core" }
palaver-topology = { path = "crates/topology" }
palaver-control = { path = "crates/control" }
palaver-node = { path = "crates/node" }
palaver-net = { path = "crates/net" }
palaver-media = { path = "crates/media" }
palaver-opus = { path = "crates/opus" }
palaver-sound = { path = "crates/sound" }
palaver-sdk = { path = "crates/sdk" }
palaver-sim = { path = "crates/sim" }
serde_json = "1"
bytes = "1"
# The window. The OpenGL renderer and no extras: fewer packages than the default (wgpu).
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "x11", "wayland", "clipboard"] }
# Tests only: finds what the window draws by its label and clicks it, with no display.
egui_kittest = { version = "0.37", default-features = false }
ed25519-dalek = "3"
getrandom = "0.4"
hkdf = "0.13"
hmac = "0.13"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
sha2 = "0.11"
sonora = "0.3"
# Cisco's H.264 encoder and decoder, built from source: the software video codec.
openh264 = "0.9"
tokio = { version = "1", default-features = false }

# Guards, mechanism 2 (docs/04): lints every crate inherits.
[workspace.lints.rust]
# Denied everywhere. A crate that wraps a C library allows it for itself, and the guards
# crate checks that no other crate does (`deny`, not `forbid`, is what lets one crate opt out).
unsafe_code = "deny"

[workspace.lints.clippy]
# Nearly everything clippy has, as warnings (CI turns warnings into errors). The groups
# come first (lower priority) so that the single lints below can override them.
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
# Which versions our dependencies pull in is theirs to decide; `cargo deny` watches it.
multiple_crate_versions = "allow"
# It asks for `map_or_else` with two closures where an `if let` with two branches reads
# better.
option_if_let_else = "allow"
# It asks for `mul_add`, which rounds once where `a * b + c` rounds twice: results then
# differ by machine (fused where the processor has it, a slow library call where not).
# The same input must give the same output everywhere.
suboptimal_flops = "allow"
# The same, for `hypot`, `ln_1p` and their like.
imprecise_flops = "allow"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
undocumented_unsafe_blocks = "deny"
# A lint is set aside with `#[expect(..., reason = "...")]`, never `#[allow]`: an `expect`
# that no longer has anything to excuse is itself reported, so none outlives its cause.
allow_attributes = "deny"
allow_attributes_without_reason = "deny"

# The simulator runs whole meetings through the sans-IO cores, so their speed is the tests'
# speed. In development and test builds the cores are optimised; overflow checks and debug
# assertions stay on, so a test still catches what an unoptimised build would.
[profile.dev.package.palaver-moq-wire]
opt-level = 2
[profile.dev.package.palaver-proto]
opt-level = 2
[profile.dev.package.palaver-khef-core]
opt-level = 2
[profile.dev.package.palaver-topology]
opt-level = 2
[profile.dev.package.palaver-control]
opt-level = 2
[profile.dev.package.palaver-node]
opt-level = 2
[profile.dev.package.palaver-sim]
opt-level = 2

# The audio processing is arithmetic in tight loops: unoptimised, a second of sound takes
# a sixth of a second, and the tests that run a made-up room would take too long.
[profile.dev.package.sonora]
opt-level = 2
[profile.dev.package.sonora-aec3]
opt-level = 2
[profile.dev.package.sonora-agc2]
opt-level = 2
[profile.dev.package.sonora-common-audio]
opt-level = 2
[profile.dev.package.sonora-fft]
opt-level = 2
[profile.dev.package.sonora-ns]
opt-level = 2
[profile.dev.package.sonora-simd]
opt-level = 2
