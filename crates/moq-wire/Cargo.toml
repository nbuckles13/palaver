[package]
name = "palaver-moq-wire"
description = "MoQT draft 22 message and object codec for the Palaver profile, including our extensions."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]

# An independent MoQ codec, used only by tests to cross-check our encodings (test oracle).
# Kept to one small crate on purpose; MOQtail would add about 160 packages for its transport.
[dev-dependencies]
bytes = "1"
moqtap-codec = { version = "0.13.0", default-features = false, features = ["draft22"] }

[lints]
workspace = true
