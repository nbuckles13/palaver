# Time budgets (docs/04-dev-environment-and-flow.md). A test over its hard limit is killed.
[profile.default]
default-filter = "not package(palaver-e2e)"
# unit and guard tests: hard limit 1 s
slow-timeout = { period = "500ms", terminate-after = 2 }
fail-fast = false

# simulation and integration tests: hard limit 5 s
[[profile.default.overrides]]
filter = "package(palaver-sim) | kind(test)"
slow-timeout = { period = "1s", terminate-after = 5 }

# The guards that shell out to `cargo metadata`: hard limit 30 s. Their time is cargo's, not
# ours, and on a cold Windows runner it has passed 5 s.
[[profile.default.overrides]]
filter = "package(palaver-guards)"
slow-timeout = { period = "5s", terminate-after = 6 }

[profile.e2e]
default-filter = "package(palaver-e2e)"
slow-timeout = { period = "10s", terminate-after = 3 }
