name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Formatting, licences and advisories do not vary by platform.
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo fmt --check
      - run: cargo deny check

  # Lints, unit tests, simulation and guards (tiers T0-T2), with time budgets enforced by nextest.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The guards on the dependency graph (crates/guards/tests/workspace.rs) run on Linux
      # only: `cargo metadata` gives the same answer on every platform, and it is the one
      # test whose time is cargo's rather than ours.
      - if: matrix.os == 'ubuntu-latest'
        run: cargo nextest run --locked
      - if: matrix.os != 'ubuntu-latest'
        run: cargo nextest run --locked -E 'not (package(palaver-guards) & binary(workspace))'
